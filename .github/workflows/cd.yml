name: cd

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'coast_runner_command_reference.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            qtbase5-dev \
            qtbase5-dev-tools \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            file
      - name: Build Linux artifact
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/build-linux

          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 \
            go build -tags "miqt serial" -trimpath -ldflags="-s -w" \
            -o dist/build-linux/ddgo \
            ./cmd/ddgo

          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/build-linux/mockgrbl \
            ./cmd/mockgrbl

          bash scripts/package-linux-app.sh \
            dist/build-linux/ddgo \
            dist/build-linux/mockgrbl \
            dist/DDGo-linux-amd64

          bash scripts/verify-linux-dist.sh dist/DDGo-linux-amd64

          tar -C dist -czf dist/DDGo-linux-amd64.tar.gz DDGo-linux-amd64
          test -s dist/DDGo-linux-amd64.tar.gz
          tar -tzf dist/DDGo-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: DDGo-linux-amd64
          path: dist/DDGo-linux-amd64.tar.gz
          if-no-files-found: error

  build-macos-slice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            lipo_arch: arm64
            slice: arm64
            macos_min: "15.0"

          - os: macos-15-intel
            arch: amd64
            lipo_arch: x86_64
            slice: amd64
            macos_min: "15.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Diagnose macOS runner
        run: |
          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "ImageOS=${ImageOS:-}"
          sw_vers
          uname -a
          uname -m
          xcode-select -p
          clang --version
          brew --version
      - name: Install macOS dependencies
        run: |
          set -euo pipefail
          brew install qt@5 pkg-config
      - name: Determine macOS cache context
        id: cache-context
        shell: bash
        run: |
          set -euo pipefail

          qt_prefix="$(brew --prefix qt@5)"
          export PATH="${qt_prefix}/bin:$PATH"
          export PKG_CONFIG_PATH="${qt_prefix}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          go_mod_cache="$(go env GOMODCACHE)"
          go_build_cache="$(go env GOCACHE)"
          qt_formula_version="$(brew list --versions qt@5 | awk 'NR == 1 { print $2 }')"
          qt_pkg_version="$(pkg-config --modversion Qt5Core)"

          if [[ -z "$go_mod_cache" ]]; then
            echo "Unable to determine GOMODCACHE" >&2
            exit 1
          fi

          if [[ -z "$go_build_cache" ]]; then
            echo "Unable to determine GOCACHE" >&2
            exit 1
          fi

          if [[ -z "$qt_formula_version" ]]; then
            echo "Unable to determine Homebrew qt@5 version" >&2
            exit 1
          fi

          if [[ -z "$qt_pkg_version" ]]; then
            echo "Unable to determine Qt5Core version" >&2
            exit 1
          fi

          echo "go_mod_cache=$go_mod_cache" >> "$GITHUB_OUTPUT"
          echo "go_build_cache=$go_build_cache" >> "$GITHUB_OUTPUT"
          echo "qt_formula_version=$qt_formula_version" >> "$GITHUB_OUTPUT"
          echo "qt_pkg_version=$qt_pkg_version" >> "$GITHUB_OUTPUT"

          echo "GOMODCACHE=$go_mod_cache"
          echo "GOCACHE=$go_build_cache"
          echo "Homebrew qt@5 version=$qt_formula_version"
          echo "Qt5Core pkg-config version=$qt_pkg_version"
      - name: Restore macOS Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.cache-context.outputs.go_mod_cache }}
          key: ddgo-go-mod-v1-${{ matrix.os }}-${{ matrix.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Restore macOS Go build cache
        id: go-build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.cache-context.outputs.go_build_cache }}
          key: ddgo-macos-build-v1-${{ matrix.os }}-${{ matrix.arch }}-macos-${{ matrix.macos_min }}-go-${{ steps.setup-go.outputs.go-version }}-qt-${{ steps.cache-context.outputs.qt_formula_version }}-${{ steps.cache-context.outputs.qt_pkg_version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Configure macOS build environment
        run: |
          set -euxo pipefail
          export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_min }}"
          qt_prefix="$(brew --prefix qt@5)"
          export PATH="${qt_prefix}/bin:$PATH"
          export PKG_CONFIG_PATH="${qt_prefix}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CGO_CFLAGS="-I${qt_prefix}/include ${CGO_CFLAGS:-}"
          export CGO_CXXFLAGS="-I${qt_prefix}/include ${CGO_CXXFLAGS:-}"
          export CGO_LDFLAGS="-F${qt_prefix}/lib -L${qt_prefix}/lib ${CGO_LDFLAGS:-}"

          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -m
          sw_vers
          go version
          clang --version
          brew --prefix
          brew --prefix qt@5
          echo "CGO_CFLAGS=$CGO_CFLAGS"
          echo "CGO_CXXFLAGS=$CGO_CXXFLAGS"
          echo "CGO_LDFLAGS=$CGO_LDFLAGS"
          pkg-config --modversion Qt5Core
          pkg-config --modversion Qt5Widgets
          qmake -query || true
          qt_plugins_dir="$(qmake -query QT_INSTALL_PLUGINS || echo "$qt_prefix/plugins")"
          ls -la "$qt_plugins_dir/platforms" || true
      - name: Build macOS app binary
        run: |
          set -euxo pipefail
          mkdir -p dist
          export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_min }}"
          qt_prefix="$(brew --prefix qt@5)"
          export PATH="${qt_prefix}/bin:$PATH"
          export PKG_CONFIG_PATH="${qt_prefix}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CGO_CFLAGS="-I${qt_prefix}/include ${CGO_CFLAGS:-}"
          export CGO_CXXFLAGS="-I${qt_prefix}/include ${CGO_CXXFLAGS:-}"
          export CGO_LDFLAGS="-F${qt_prefix}/lib -L${qt_prefix}/lib ${CGO_LDFLAGS:-}"

          GOOS=darwin GOARCH=${{ matrix.arch }} CGO_ENABLED=1 \
            go build -x -tags "miqt serial" -trimpath -ldflags="-s -w" \
            -o dist/ddgo-darwin-${{ matrix.slice }} \
            ./cmd/ddgo
      - name: Save macOS Go module cache
        if: steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cache-context.outputs.go_mod_cache }}
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}
      - name: Save macOS Go build cache
        if: steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cache-context.outputs.go_build_cache }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
      - name: Inspect macOS app binary
        run: |
          set -euxo pipefail
          export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_min }}"
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix qt@5)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          file dist/ddgo-darwin-${{ matrix.slice }}
          lipo -archs dist/ddgo-darwin-${{ matrix.slice }}
          otool -L dist/ddgo-darwin-${{ matrix.slice }}
      - name: Package macOS app slice
        run: |
          set -euxo pipefail
          export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_min }}"
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix qt@5)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          rm -rf dist/macos-${{ matrix.slice }}
          mkdir -p dist/macos-${{ matrix.slice }}

          bash scripts/package-macos-app.sh \
            ${{ matrix.arch }} \
            dist/ddgo-darwin-${{ matrix.slice }} \
            dist/macos-${{ matrix.slice }}/DDGo.app \
            ${{ github.ref_name }}
      - name: Verify macOS app slice
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_min }}"
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix qt@5)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          bash scripts/verify-macos-app.sh dist/macos-${{ matrix.slice }}/DDGo.app ${{ matrix.lipo_arch }} 15.0
      - name: Archive macOS app slice
        run: |
          set -euo pipefail
          mkdir -p dist/app-artifacts
          tar -C dist/macos-${{ matrix.slice }} -czf dist/app-artifacts/DDGo-app-${{ matrix.slice }}.tar.gz DDGo.app
          ls -lh dist/app-artifacts/DDGo-app-${{ matrix.slice }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: DDGo-app-${{ matrix.slice }}
          path: dist/app-artifacts/DDGo-app-${{ matrix.slice }}.tar.gz

  build-macos-universal:
    needs: [build-macos-slice]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: DDGo-app-arm64
          path: slices/DDGo-app-arm64
      - uses: actions/download-artifact@v4
        with:
          name: DDGo-app-amd64
          path: slices/DDGo-app-amd64
      - name: Extract macOS app slices
        run: |
          set -euo pipefail

          echo "Downloaded artifact layout:"
          find slices -maxdepth 5 -print | sort

          mkdir -p slices/extracted/arm64 slices/extracted/amd64

          tar -xzf slices/DDGo-app-arm64/DDGo-app-arm64.tar.gz -C slices/extracted/arm64
          tar -xzf slices/DDGo-app-amd64/DDGo-app-amd64.tar.gz -C slices/extracted/amd64

          test -d slices/extracted/arm64/DDGo.app
          test -d slices/extracted/amd64/DDGo.app

          echo "Extracted app layout:"
          find slices/extracted -maxdepth 5 -print | sort | sed -n '1,200p'
      - name: Merge universal macOS app
        run: |
          set -euo pipefail
          bash scripts/merge-macos-universal.sh \
            slices/extracted/arm64/DDGo.app \
            slices/extracted/amd64/DDGo.app \
            dist/macos-universal/DDGo.app
      - name: Verify universal macOS app
        run: bash scripts/verify-macos-universal-app.sh dist/macos-universal/DDGo.app 15.0
      - name: Create universal macOS DMG
        run: bash scripts/create-macos-dmg.sh dist/macos-universal/DDGo.app dist/DDGo-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DDGo-macos-universal
          path: dist/DDGo-macos-universal.dmg

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-pkgconf
            zip
          msystem: MINGW64
          path-type: inherit
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Determine Windows Go cache context
        id: windows-cache-context
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="${MINGW_PREFIX}/bin:/usr/bin:${PATH}"
          export CC=gcc

          normalize_windows_path() {
            local raw="$1"

            if [[ "$raw" =~ ^[A-Za-z]:[\\/].* ]]; then
              printf '%s\n' "$raw" | sed 's#\\#/#g'
            else
              cygpath -m "$raw"
            fi
          }

          go_version="$(go env GOVERSION)"
          go_mod_cache="$(normalize_windows_path "$(go env GOMODCACHE)")"
          go_build_cache="$(normalize_windows_path "$(go env GOCACHE)")"

          toolchain_packages=(
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-crt
            mingw-w64-x86_64-headers
            mingw-w64-x86_64-winpthreads
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-pkgconf
          )

          toolchain_description="$(
            pacman -Q "${toolchain_packages[@]}" |
              LC_ALL=C sort
          )"

          toolchain_hash="$(
            printf '%s\n' "$toolchain_description" |
              sha256sum |
              awk '{print $1}'
          )"

          if [[ -z "$go_version" ]]; then
            echo "Unable to determine Go version" >&2
            exit 1
          fi

          if [[ -z "$go_mod_cache" ]]; then
            echo "Unable to determine GOMODCACHE" >&2
            exit 1
          fi

          if [[ -z "$go_build_cache" ]]; then
            echo "Unable to determine GOCACHE" >&2
            exit 1
          fi

          if [[ -z "$toolchain_hash" ]]; then
            echo "Unable to determine Windows toolchain fingerprint" >&2
            exit 1
          fi

          {
            echo "go_version=$go_version"
            echo "go_mod_cache=$go_mod_cache"
            echo "go_build_cache=$go_build_cache"
            echo "toolchain_hash=$toolchain_hash"
          } >> "$GITHUB_OUTPUT"

          echo "Go version: $go_version"
          echo "GOMODCACHE: $go_mod_cache"
          echo "GOCACHE: $go_build_cache"
          echo "MSYS2 toolchain:"
          printf '%s\n' "$toolchain_description"
          echo "Toolchain fingerprint: $toolchain_hash"
      - name: Restore Windows Go module cache
        id: windows-go-mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.windows-cache-context.outputs.go_mod_cache }}
          key: ddgo-go-mod-v1-windows-msys2-${{ steps.windows-cache-context.outputs.go_version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Restore Windows Go build cache
        id: windows-go-build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.windows-cache-context.outputs.go_build_cache }}
          key: ddgo-windows-build-v1-windows-2022-mingw64-amd64-${{ steps.windows-cache-context.outputs.toolchain_hash }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build and stage Windows app
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          export PATH="${MINGW_PREFIX}/bin:/usr/bin:${PATH}"
          export CC=gcc

          go version
          gcc --version

          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
            go build -tags "miqt serial" -trimpath -ldflags="-s -w -H windowsgui" \
            -o dist/ddgo-windows-amd64.exe \
            ./cmd/ddgo

          bash scripts/stage-windows-msys2.sh \
            dist/ddgo-windows-amd64.exe \
            dist/windows/DDGo

          (
            cd dist/windows
            rm -f ../DDGo-windows-amd64.zip
            zip -r ../DDGo-windows-amd64.zip DDGo
          )
      - name: Save Windows Go module cache
        if: steps.windows-go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.windows-cache-context.outputs.go_mod_cache }}
          key: ${{ steps.windows-go-mod-cache.outputs.cache-primary-key }}
      - name: Save Windows Go build cache
        if: steps.windows-go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.windows-cache-context.outputs.go_build_cache }}
          key: ${{ steps.windows-go-build-cache.outputs.cache-primary-key }}
      - name: Verify Windows staged folder and ZIP
        shell: pwsh
        run: |
          .\scripts\verify-windows-dist.ps1 -DistDir dist\windows\DDGo

          New-Item -ItemType Directory -Path dist\check | Out-Null
          Expand-Archive -Path dist\DDGo-windows-amd64.zip -DestinationPath dist\check -Force
          .\scripts\verify-windows-dist.ps1 -DistDir dist\check\DDGo
      - name: Verify Windows installer policy
        shell: pwsh
        run: .\scripts\verify-windows-installer-policy.ps1
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "iscc"
          }

          $version = "${{ github.ref_name }}"
          if ($version -eq "master" -or [string]::IsNullOrWhiteSpace($version)) {
            $version = "0.0.0"
          }
          $version = $version.TrimStart("v")

          & $iscc `
            /DMyAppVersion="$version" `
            /DSourceDir="$pwd\dist\windows\DDGo" `
            /DOutputDir="$pwd\dist" `
            installer\windows\DDGo.iss

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Test-Path dist\DDGo-windows-amd64-setup.exe
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installDir = Join-Path $pwd "dist\installed"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null

          Start-Process `
            -FilePath "dist\DDGo-windows-amd64-setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" `
            -Wait `
            -NoNewWindow

          .\scripts\verify-windows-dist.ps1 -DistDir $installDir

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            Write-Error "Expected Inno uninstaller missing: $uninstaller"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DDGo-windows-amd64
          path: |
            dist/DDGo-windows-amd64.zip
            dist/DDGo-windows-amd64-setup.exe

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-linux, build-macos-universal, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          if-no-artifact-found: ignore
      - name: Validate required release artifacts
        run: |
          set -euo pipefail

          echo "Downloaded release artifact layout:"
          find dist -maxdepth 4 -type f -print | sort

          required=(
            "dist/DDGo-linux-amd64/DDGo-linux-amd64.tar.gz"
            "dist/DDGo-macos-universal/DDGo-macos-universal.dmg"
            "dist/DDGo-windows-amd64/DDGo-windows-amd64.zip"
            "dist/DDGo-windows-amd64/DDGo-windows-amd64-setup.exe"
          )

          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required release artifact: $path" >&2
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          body: |
            ### Linux

            `DDGo-linux-amd64.tar.gz` contains a `DDGo-linux-amd64/` distribution with the Linux amd64 `ddgo` GUI command, `mockgrbl`, a launcher script, and bundled Qt/runtime libraries and plugins needed by the MIQT UI. Run `./run-ddgo.sh` from the extracted folder so the bundled library and Qt plugin paths are configured.

            ### macOS

            `DDGo-macos-universal.dmg` is a universal macOS 15+ build containing both Apple Silicon (`arm64`) and Intel (`x86_64`) slices.

            macOS 14 and earlier are no longer supported.

            ### Windows

            `DDGo-windows-amd64-setup.exe` is the recommended Windows installer.

            Requires Windows 10 or later on a 64-bit/x64-compatible system. Windows 7 and Windows 8/8.1 are not supported. Extracting the portable ZIP on an older operating system does not make that system supported.

            `DDGo-windows-amd64.zip` is also provided as a portable/debug package. If using the ZIP, extract the whole `DDGo` folder before running `DDGo.exe`.
          files: |
            dist/DDGo-linux-amd64/DDGo-linux-amd64.tar.gz
            dist/DDGo-macos-universal/DDGo-macos-universal.dmg
            dist/DDGo-windows-amd64/DDGo-windows-amd64.zip
            dist/DDGo-windows-amd64/DDGo-windows-amd64-setup.exe
